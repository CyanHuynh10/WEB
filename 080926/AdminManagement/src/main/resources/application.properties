spring.application.name=AdminManagement
server.port=8080

# Cấu hình Spring MVC View Resolver cho JSP
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# Cấu hình Database SQL Server (Tạo database tên BaiTap06DB trong SSMS trước)
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=AdminManagement;encrypt=true;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=2006
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true