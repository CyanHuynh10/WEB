<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layouts/layout}">
<head>
    <title>Đăng nhập</title>
</head>
<body>
<main layout:fragment="content">
    <div style="max-width: 400px; margin: 50px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">
        <h2 style="text-align: center; color: #333; margin-bottom: 20px;">Đăng nhập</h2>
        <div th:if="${param.error}" style="background: #ffebee; color: #c62828; padding: 10px; border-radius: 5px; margin-bottom: 15px; text-align: center;">
            Username/email hoặc password không đúng
        </div>
        <div th:if="${param.logout}" style="background: #e8f5e9; color: #2e7d32; padding: 10px; border-radius: 5px; margin-bottom: 15px; text-align: center;">
            Bạn đã đăng xuất
        </div>
        <form th:action="@{/login}" method="post">
            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; color: #555;">Username hoặc Email</label>
                <input type="text" name="username" placeholder="Username hoặc email" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
            </div>
            <div style="margin-bottom: 20px;">
                <label style="display: block; margin-bottom: 5px; color: #555;">Password</label>
                <input type="password" name="password" placeholder="Password" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
            </div>
            <button type="submit" style="width: 100%; background: #4CAF50; color: white; border: none; padding: 12px; border-radius: 4px; font-size: 16px; cursor: pointer;">Đăng nhập</button>
        </form>
    </div>
</main>
</body>
</html>
