<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Đặt lại mật khẩu</title>
</head>
<body style="margin: 0; font-family: Arial, sans-serif; background-color: #f4f4f4;">
    <div th:replace="~{fragments/header :: header}"></div>
    <main>
        <div style="max-width: 400px; margin: 50px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">
            <h2 style="text-align: center; color: #333; margin-bottom: 20px;">Đặt lại mật khẩu</h2>
            <div th:if="${error}" style="background: #ffebee; color: #c62828; padding: 10px; border-radius: 5px; margin-bottom: 15px; text-align: center;" th:text="${error}"></div>
            <form th:action="@{/reset-password}" method="post">
                <input type="hidden" name="email" th:value="${email}">
                <div style="margin-bottom: 20px;">
                    <label style="display: block; margin-bottom: 5px; color: #555;">Mật khẩu mới</label>
                    <input type="password" name="password" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
                </div>
                <button type="submit" style="width: 100%; background: #FF9800; color: white; border: none; padding: 12px; border-radius: 4px; font-size: 16px; cursor: pointer;">Lưu mật khẩu mới</button>
            </form>
        </div>
    </main>
</body>
</html>
