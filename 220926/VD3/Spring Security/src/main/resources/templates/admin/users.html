<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Quản lý User</title>
</head>
<body style="margin: 0; font-family: Arial, sans-serif; background-color: #f4f4f4;">
    <div th:replace="~{fragments/header :: header}"></div>
    <main style="max-width: 1000px; margin: 30px auto; background: white; padding: 20px; border-radius: 8px;">
        <h2>Danh sách User (Admin Only)</h2>
        <table style="width: 100%; border-collapse: collapse; margin-top: 15px;">
            <tr style="background: #4CAF50; color: white;">
                <th style="padding: 10px; border: 1px solid #ddd;">ID</th>
                <th style="padding: 10px; border: 1px solid #ddd;">Username</th>
                <th style="padding: 10px; border: 1px solid #ddd;">Email</th>
                <th style="padding: 10px; border: 1px solid #ddd;">Full Name</th>
                <th style="padding: 10px; border: 1px solid #ddd;">Role</th>
                <th style="padding: 10px; border: 1px solid #ddd;">Trạng thái</th>
            </tr>
            <tr th:each="u : ${userPage.content}">
                <td style="padding: 10px; border: 1px solid #ddd;" th:text="${u.id}"></td>
                <td style="padding: 10px; border: 1px solid #ddd;" th:text="${u.username}"></td>
                <td style="padding: 10px; border: 1px solid #ddd;" th:text="${u.email}"></td>
                <td style="padding: 10px; border: 1px solid #ddd;" th:text="${u.fullName}"></td>
                <td style="padding: 10px; border: 1px solid #ddd;" th:text="${u.role.name}"></td>
                <td style="padding: 10px; border: 1px solid #ddd; text-align: center;">
                    <span th:if="${u.enabled}" style="color: green; font-weight: bold;">Active</span>
                    <span th:unless="${u.enabled}" style="color: red; font-weight: bold;">Inactive</span>
                </td>
            </tr>
        </table>
        
        <div style="margin-top: 20px; text-align: center;" th:if="${userPage.totalPages > 1}">
            <a th:if="${userPage.hasPrevious()}" th:href="@{/admin/users(page=${userPage.number - 1})}" style="padding: 5px 10px; background: #ddd; text-decoration: none; color: black; border-radius: 3px;">&laquo; Previous</a>
            <span th:text="'Trang ' + (${userPage.number + 1}) + ' / ' + ${userPage.totalPages}" style="margin: 0 10px;"></span>
            <a th:if="${userPage.hasNext()}" th:href="@{/admin/users(page=${userPage.number + 1})}" style="padding: 5px 10px; background: #ddd; text-decoration: none; color: black; border-radius: 3px;">Next &raquo;</a>
        </div>
    </main>
</body>
</html>
