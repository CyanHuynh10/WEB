<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Quản lý Sản phẩm</title>
</head>
<body style="margin: 0; font-family: Arial, sans-serif; background-color: #f4f4f4;">
    <div th:replace="~{fragments/header :: header}"></div>
    <main style="max-width: 1000px; margin: 30px auto; background: white; padding: 20px; border-radius: 8px;">
        <h2>Danh sách Sản phẩm</h2>
        <div style="display: flex; justify-content: space-between; margin-bottom: 15px;">
            <a th:href="@{/products/new}" style="background: #2196F3; color: white; text-decoration: none; padding: 10px 15px; border-radius: 5px;">+ Thêm sản phẩm</a>
            
            <form th:action="@{/products}" method="get" style="display: flex; gap: 10px;">
                <input type="text" name="search" th:value="${search}" placeholder="Tìm tên sản phẩm..." style="padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
                <button type="submit" style="background: #4CAF50; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer;">Tìm kiếm</button>
            </form>
        </div>
        
        <table style="width: 100%; border-collapse: collapse;">
            <tr style="background: #4CAF50; color: white;">
                <th style="padding: 10px; border: 1px solid #ddd;">ID</th>
                <th style="padding: 10px; border: 1px solid #ddd;">Ảnh</th>
                <th style="padding: 10px; border: 1px solid #ddd;">Tên sản phẩm</th>
                <th style="padding: 10px; border: 1px solid #ddd;">Giá</th>
                <th style="padding: 10px; border: 1px solid #ddd;">Người tạo</th>
                <th style="padding: 10px; border: 1px solid #ddd;">Thao tác</th>
            </tr>
            <tr th:each="p : ${productPage.content}">
                <td style="padding: 10px; border: 1px solid #ddd; text-align: center;" th:text="${p.id}"></td>
                <td style="padding: 10px; border: 1px solid #ddd; text-align: center;">
                    <img th:if="${p.imageUrl}" th:src="${p.imageUrl}" style="width: 50px; height: 50px; object-fit: cover; border-radius: 5px;">
                    <span th:unless="${p.imageUrl}">No Image</span>
                </td>
                <td style="padding: 10px; border: 1px solid #ddd;" th:text="${p.name}"></td>
                <td style="padding: 10px; border: 1px solid #ddd;" th:text="${p.price} + ' VNĐ'"></td>
                <td style="padding: 10px; border: 1px solid #ddd;" th:text="${p.user.fullName}"></td>
                <td style="padding: 10px; border: 1px solid #ddd; text-align: center;">
                    <a th:href="@{/products/delete/{id}(id=${p.id})}" style="color: #f44336; text-decoration: none;" onclick="return confirm('Bạn có chắc chắn muốn xóa?');">Xóa</a>
                </td>
            </tr>
        </table>
        
        <div style="margin-top: 20px; text-align: center;" th:if="${productPage.totalPages > 1}">
            <a th:if="${productPage.hasPrevious()}" th:href="@{/products(page=${productPage.number - 1}, search=${search})}" style="padding: 5px 10px; background: #ddd; text-decoration: none; color: black; border-radius: 3px;">&laquo; Previous</a>
            <span th:text="'Trang ' + (${productPage.number + 1}) + ' / ' + ${productPage.totalPages}" style="margin: 0 10px;"></span>
            <a th:if="${productPage.hasNext()}" th:href="@{/products(page=${productPage.number + 1}, search=${search})}" style="padding: 5px 10px; background: #ddd; text-decoration: none; color: black; border-radius: 3px;">Next &raquo;</a>
        </div>
    </main>
</body>
</html>
