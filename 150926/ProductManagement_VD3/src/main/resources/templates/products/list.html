<!DOCTYPE html>
<html lang="vi" xmlns:th="https://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title>Danh sách sản phẩm</title>
</head>
<body>
    <section layout:fragment="content">
        <div class="d-flex justify-content-between mb-4">
            <h2>Danh sách sản phẩm</h2>
            <a class="btn btn-primary" th:href="@{/products/create}">+ Thêm sản phẩm</a>
        </div>
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <form class="row mt-3 mb-3" method="get" th:action="@{/products}">
            <div class="col-md-6"><input type="text" class="form-control" name="keyword" th:value="${keyword}" placeholder="Nhập tên sản phẩm..."></div>
            <div class="col-md-2">
                <select class="form-select" name="size">
                    <option value="5" th:selected="${size == 5}">5 dòng</option>
                    <option value="10" th:selected="${size == 10}">10 dòng</option>
                    <option value="20" th:selected="${size == 20}">20 dòng</option>
                </select>
            </div>
            <div class="col-md-2"><button class="btn btn-success" type="submit">Tìm kiếm</button></div>
        </form>

        <table class="table table-bordered table-hover align-middle">
            <thead class="table-dark">
                <tr><th>ID</th><th>Hình ảnh</th><th>Tên sản phẩm</th><th>Giá</th><th>Số lượng</th><th>Mô tả</th><th>Thao tác</th></tr>
            </thead>
            <tbody>
                <tr th:each="product : ${products.content}">
                    <td th:text="${product.id}"></td>
                    <td>
                        <!-- Hiển thị lưới ảnh bằng vòng lặp[cite: 1] -->
                        <div class="d-flex gap-2 flex-wrap" th:if="${product.images != null and !product.images.empty}">
                            <img th:each="img : ${product.images}" th:src="@{'/uploads/products/' + ${img.imageUrl}}" style="width: 60px; height: 60px; object-fit: cover; border-radius: 8px;">
                        </div>
                        <span th:if="${product.images == null or product.images.empty}" class="text-muted">Chưa có ảnh</span>
                    </td>
                    <td th:text="${product.name}"></td>
                    <td><span th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 2, 'POINT')}"></span></td>
                    <td th:text="${product.quantity}"></td>
                    <td th:text="${product.description}"></td>
                    <td>
                        <a class="btn btn-warning btn-sm" th:href="@{/products/edit/{id}(id=${product.id})}">Sửa</a>
                        <a class="btn btn-danger btn-sm" th:href="@{/products/delete/{id}(id=${product.id})}" onclick="return confirm('Xóa?');">Xóa</a>
                    </td>
                </tr>
            </tbody>
        </table>

        <!-- BỘ PHÂN TRANG -->
        <nav th:if="${products.totalPages > 1}">
            <ul class="pagination">
                <li class="page-item" th:classappend="${products.first} ? 'disabled'"><a class="page-link" th:href="@{/products(page=${products.number - 1}, size=${size}, keyword=${keyword})}">Previous</a></li>
                <li class="page-item" th:each="i : ${#numbers.sequence(0, products.totalPages - 1)}" th:classappend="${i == products.number} ? 'active'"><a class="page-link" th:text="${i + 1}" th:href="@{/products(page=${i}, size=${size}, keyword=${keyword})}"></a></li>
                <li class="page-item" th:classappend="${products.last} ? 'disabled'"><a class="page-link" th:href="@{/products(page=${products.number + 1}, size=${size}, keyword=${keyword})}">Next</a></li>
            </ul>
        </nav>
    </section>
</body>
</html>
