<!DOCTYPE html>
<!-- Khai báo sử dụng layout từ file main.html -->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>Category Management</title>
</head>
<body>

    <!-- Nội dung bên trong thẻ này sẽ được nhúng vào phần <main layout:fragment="content"> của file main.html -->
    <div layout:fragment="content">
        
        <h2 class="page-title">Category Management</h2>

        <!-- Khối hiển thị thông báo Thành công / Lỗi -->
        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

        <!-- Toolbar: Thanh tìm kiếm và Nút Add -->
        <div style="display: flex; justify-content: space-between; margin-bottom: 1.5rem; align-items: center;">
            
            <!-- Form Tìm kiếm -->
            <form th:action="@{/categories}" method="get" style="display: flex; gap: 10px;">
                <!-- Giữ lại keyword sau khi submit -->
                <input type="text" name="keyword" th:value="${keyword}" 
                       placeholder="Search category..." 
                       style="padding: 0.5rem; border: 1px solid var(--border-color); border-radius: 6px; min-width: 250px;">
                <button type="submit" class="btn btn-primary">Search</button>
                <a th:href="@{/categories}" class="btn" style="background: var(--border-color); color: #333;">Clear</a>
            </form>

            <!-- Nút Thêm mới -->
            <a th:href="@{/categories/add}" class="btn btn-primary">+ Add New</a>
        </div>

        <!-- Bảng Dữ Liệu -->
        <table>
            <thead>
                <tr>
                    <th style="width: 15%;">ID</th>
                    <th style="width: 55%;">Name</th>
                    <th style="width: 30%; text-align: center;">Action</th>
                </tr>
            </thead>
            <tbody>
                <!-- Vòng lặp foreach của Thymeleaf -->
                <tr th:each="cat : ${categoryPage.content}">
                    <td th:text="${cat.categoryId}"></td>
                    <td th:text="${cat.name}"></td>
                    <td style="text-align: center;">
                        <a th:href="@{/categories/edit/{id}(id=${cat.categoryId})}" class="btn btn-primary" style="margin-right: 5px;">Edit</a>
                        
                        <!-- Xác nhận Delete bằng Javascript -->
                        <a th:href="@{/categories/delete/{id}(id=${cat.categoryId})}" class="btn btn-danger" 
                           onclick="return confirm('Bạn có chắc muốn xóa Category này?');">Delete</a>
                    </td>
                </tr>
                
                <!-- Hiển thị khi danh sách trống -->
                <tr th:if="${categoryPage.empty}">
                    <td colspan="3" style="text-align: center; color: var(--text-muted); padding: 2rem;">
                        No categories found.
                    </td>
                </tr>
            </tbody>
        </table>

        <!-- Thanh Phân Trang (Pagination) -->
        <div th:if="${categoryPage.totalPages > 1}" style="display: flex; justify-content: center; gap: 5px; margin-top: 2rem;">
            
            <!-- Nút First -->
            <a th:if="${categoryPage.number > 0}" 
               th:href="@{/categories(page=1, keyword=${keyword})}" 
               class="btn" style="background: var(--secondary-pastel); color: #333;">First</a>

            <!-- Các nút Số trang -->
            <a th:each="pageNum : ${pageNumbers}" 
               th:href="@{/categories(page=${pageNum}, keyword=${keyword})}"
               th:text="${pageNum}"
               th:style="${pageNum == categoryPage.number + 1 ? 'background: var(--primary-pastel); font-weight: bold;' : 'background: var(--secondary-pastel); color: #333;'}"
               class="btn"></a>

            <!-- Nút Last -->
            <a th:if="${categoryPage.number < categoryPage.totalPages - 1}" 
               th:href="@{/categories(page=${categoryPage.totalPages}, keyword=${keyword})}" 
               class="btn" style="background: var(--secondary-pastel); color: #333;">Last</a>
               
        </div>
    </div>
</body>
</html>
